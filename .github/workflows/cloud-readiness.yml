name: Cloud readiness
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify models and all 59 predictions
        run: python -m agrocebada.cli verify
      - name: Test data, models and frontend exports
        run: python -m pytest -q tests experiments/estratificacion-pyr-20261018/tests experiments/fisiologia-siniestros-20261018/tests
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install official frontend dependencies
        run: npm --prefix frontend ci
      - name: Build official Cloudflare interface
        run: npm run dashboard:build
